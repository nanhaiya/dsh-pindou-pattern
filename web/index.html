const STANDARD_SERIES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'M'];

function clamp(value, min, max) {
  return value < min ? min : value > max ? max : value;
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function srgbToLinear(channel) {
  const c = channel / 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

function rgbToLab(r, g, b) {
  const R = srgbToLinear(r);
  const G = srgbToLinear(g);
  const B = srgbToLinear(b);
  const x = (R * 0.4124564 + G * 0.3575761 + B * 0.1804375) / 0.95047;
  const y = R * 0.2126729 + G * 0.7151522 + B * 0.072175;
  const z = (R * 0.0193339 + G * 0.119192 + B * 0.9503041) / 1.08883;
  const f = (t) => (t > 0.008856451679035631 ? Math.cbrt(t) : 7.787037037037035 * t + 16 / 116);
  const fx = f(x);
  const fy = f(y);
  const fz = f(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}

function labDistanceSq(lab, offset, L, A, B) {
  const dl = lab[offset] - L;
  const da = lab[offset + 1] - A;
  const db = lab[offset + 2] - B;
  return dl * dl + da * da + db * db;
}

function hexLuminance(hex) {
  const [r, g, b] = hexToRgb(hex);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
}

  color.rgb = rgb;
  color.lab = rgbToLab(rgb[0], rgb[1], rgb[2]);
  color.standard = STANDARD_SERIES.indexOf(color.series) !== -1;
  color.luminance = hexLuminance(color.hex);
}

/**
 * Guess a flat background from the image border. Returns null when the
 * border is not uniform enough (a photo) or is mostly transparent.
 */
function estimateBackground(rgba, w, h) {
  const points = [];
  const push = (x, y) => {
    const i = (y * w + x) * 4;
    if (rgba[i + 3] < 128) return;
    points.push([rgba[i], rgba[i + 1], rgba[i + 2]]);
  };
  for (let x = 0; x < w; x += 1) {
    push(x, 0);
    if (h > 1) push(x, h - 1);
  }
  for (let y = 1; y < h - 1; y += 1) {
    push(0, y);
    if (w > 1) push(w - 1, y);
  }
  if (points.length < 12) return null;
  const median = [0, 1, 2].map((channel) => {
    const values = points.map((p) => p[channel]).sort((a, b) => a - b);
    return values[values.length >> 1];
  });
  const bgLab = rgbToLab(median[0], median[1], median[2]);
  let close = 0;
  for (const p of points) {
    const lab = rgbToLab(p[0], p[1], p[2]);
    const d = labDistanceSq(lab, 0, bgLab[0], bgLab[1], bgLab[2]);
    if (d <= 100) close += 1;
  }
  if (close / points.length < 0.55) return null;
  return { lab: bgLab, coverage: close / points.length };
}

function buildTrainingSet(labs, valid, count) {
  const limit = 12000;
  const stride = count > limit ? Math.ceil(count / limit) : 1;
  const picked = [];
  for (let i = 0; i < count; i += stride) picked.push(valid[i]);
  const sub = new Float32Array(picked.length * 3);
  for (let i = 0; i < picked.length; i += 1) {
    const at = picked[i] * 3;
    sub[i * 3] = labs[at];
    sub[i * 3 + 1] = labs[at + 1];
    sub[i * 3 + 2] = labs[at + 2];
  }
  return sub;
}

/** Deterministic k-means (k-means++ seeding, 12 refinement rounds). */
function kmeans(sub, k) {
  const n = sub.length / 3;
  const centers = new Float32Array(k * 3);
  let seed = 0x9e3779b9;
  const random = () => {
    seed = (seed ^ (seed << 13)) >>> 0;
    seed = (seed ^ (seed >>> 17)) >>> 0;
    seed = (seed ^ (seed << 5)) >>> 0;
    return seed / 4294967296;
  };
  const first = Math.floor(random() * n);
  centers[0] = sub[first * 3];
  centers[1] = sub[first * 3 + 1];
  centers[2] = sub[first * 3 + 2];
  const nearestDist = new Float32Array(n).fill(Infinity);
  for (let c = 1; c < k; c += 1) {
    const prev = (c - 1) * 3;
    let sum = 0;
    for (let i = 0; i < n; i += 1) {
      const d = labDistanceSq(sub, i * 3, centers[prev], centers[prev + 1], centers[prev + 2]);
      if (d < nearestDist[i]) nearestDist[i] = d;
      sum += nearestDist[i];
    }
    let target = random() * sum;
    let pick = 0;
    for (let i = 0; i < n; i += 1) {
      target -= nearestDist[i];
      if (target <= 0) {
        pick = i;
        break;
      }
    }
    centers[c * 3] = sub[pick * 3];
    centers[c * 3 + 1] = sub[pick * 3 + 1];
    centers[c * 3 + 2] = sub[pick * 3 + 2];
  }
  const assign = new Uint16Array(n);
  for (let round = 0; round < 12; round += 1) {
    const sums = new Float64Array(k * 3);
    const counts = new Uint32Array(k);
    for (let i = 0; i < n; i += 1) {
      let best = 0;
      let bestDistance = Infinity;
      const at = i * 3;
      const L = sub[at];
      const A = sub[at + 1];
      const B = sub[at + 2];
      for (let c = 0; c < k; c += 1) {
        const d = labDistanceSq(centers, c * 3, L, A, B);
        if (d < bestDistance) {
          bestDistance = d;
          best = c;
        }
      }
      assign[i] = best;
      counts[best] += 1;
      sums[best * 3] += L;
      sums[best * 3 + 1] += A;
      sums[best * 3 + 2] += B;
    }
    let shift = 0;
    for (let c = 0; c < k; c += 1) {
      if (counts[c] === 0) {
        const pick = Math.floor(random() * n);
        centers[c * 3] = sub[pick * 3];
        centers[c * 3 + 1] = sub[pick * 3 + 1];
        centers[c * 3 + 2] = sub[pick * 3 + 2];
        continue;
      }
      const L = sums[c * 3] / counts[c];
      const A = sums[c * 3 + 1] / counts[c];
      const B = sums[c * 3 + 2] / counts[c];
      const d = labDistanceSq(centers, c * 3, L, A, B);
      if (d > shift) shift = d;
      centers[c * 3] = L;
      centers[c * 3 + 1] = A;
      centers[c * 3 + 2] = B;
    }
    if (shift < 0.02) break;
  }
  return centers;
}

function nearestIn(list, L, A, B) {
  let best = 0;
  let bestDistance = Infinity;
  for (let i = 0; i < list.length; i += 1) {
    const lab = list[i];
    const dl = L - lab[0];
    const da = A - lab[1];
    const db = B - lab[2];
    const d = dl * dl + da * da + db * db;
    if (d < bestDistance) {
      bestDistance = d;
      best = i;
    }
  }
  return best;
}

function codeOrder(a, b) {
  if (a.count !== b.count) return b.count - a.count;
  return a.code < b.code ? -1 : a.code > b.code ? 1 : 0;
}

/**
 * Turn a W×H RGBA buffer into bead cells.
 *
 * @param rgba  Uint8ClampedArray / Uint8Array of length w*h*4
 * @param w     grid columns
 * @param h     grid rows
 * @param opts  { maxColors, scope: 'standard'|'all', dither, removeBg, tolerance }
 */
function buildPattern(rgba, w, h, opts) {
  const options = opts || {};
  const n = w * h;
  if (!n) throw patternError('empty');
  const scope = options.scope === 'all' ? MARD_ALL : MARD_STANDARD;
  const paletteLabs = scope.map((c) => c.lab);
  const tolerance = clamp(Number(options.tolerance) || 0, 0, 80);
  const toleranceSq = tolerance * tolerance;
  const bg = options.removeBg ? estimateBackground(rgba, w, h) : null;
  const bgLab = bg ? bg.lab : null;

  const empty = new Uint8Array(n);
  const labs = new Float32Array(n * 3);
  const valid = new Int32Array(n);
  let live = 0;
  for (let i = 0; i < n; i += 1) {
    const alpha = rgba[i * 4 + 3];
    if (alpha < 96) {
      empty[i] = 1;
      continue;
    }
    let r = rgba[i * 4];
    let g = rgba[i * 4 + 1];
    let b = rgba[i * 4 + 2];
    if (alpha < 250) {
      const f = alpha / 255;
      r = Math.round(r * f + 255 * (1 - f));
      g = Math.round(g * f + 255 * (1 - f));
      b = Math.round(b * f + 255 * (1 - f));
    }
    const lab = rgbToLab(r, g, b);
    if (bgLab && labDistanceSq(lab, 0, bgLab[0], bgLab[1], bgLab[2]) <= toleranceSq) {
      empty[i] = 1;
      continue;
    }
    labs[i * 3] = lab[0];
    labs[i * 3 + 1] = lab[1];
    labs[i * 3 + 2] = lab[2];
    valid[live] = i;
    live += 1;
  }
  if (live === 0) throw patternError('empty');

  const maxColors = Math.floor(Number(options.maxColors) || 24);
  const k = Math.max(1, Math.min(64, maxColors, live));
  const training = buildTrainingSet(labs, valid, live);
  const centers = kmeans(training, k);

  const chosenIndexes = [];
  const seen = new Set();
  for (let c = 0; c < k; c += 1) {
    const pick = nearestIn(paletteLabs, centers[c * 3], centers[c * 3 + 1], centers[c * 3 + 2]);
    if (!seen.has(pick)) {
      seen.add(pick);
      chosenIndexes.push(pick);
    }
  }
  const chosen = chosenIndexes.map((i) => scope[i]);
  const chosenLabs = chosen.map((c) => c.lab);
  const cells = new Int32Array(n).fill(-1);
  const counts = new Uint32Array(chosen.length);

  if (options.dither) {
    const error = new Float32Array(n * 3);
    for (let y = 0; y < h; y += 1) {
      const forward = y % 2 === 0;
      for (let step = 0; step < w; step += 1) {
        const x = forward ? step : w - 1 - step;
        const index = y * w + x;
        if (empty[index]) continue;
        const L = labs[index * 3] + error[index * 3];
        const A = labs[index * 3 + 1] + error[index * 3 + 1];
        const B = labs[index * 3 + 2] + error[index * 3 + 2];
        let best = 0;
        let bestDistance = Infinity;
        for (let c = 0; c < chosenLabs.length; c += 1) {
          const lab = chosenLabs[c];
          const dl = L - lab[0];
          const da = A - lab[1];
          const db = B - lab[2];
          const d = dl * dl + da * da + db * db;
          if (d < bestDistance) {
            bestDistance = d;
            best = c;
          }
        }
        cells[index] = best;
        counts[best] += 1;
        const eL = L - chosenLabs[best][0];
        const eA = A - chosenLabs[best][1];
        const eB = B - chosenLabs[best][2];
        const spread = (dx, dy, weight) => {
          const nx = x + dx;
          const ny = y + dy;
          if (nx < 0 || nx >= w || ny < 0 || ny >= h) return;
          const at = (ny * w + nx) * 3;
          if (empty[ny * w + nx]) return;
          error[at] += eL * weight;
          error[at + 1] += eA * weight;
          error[at + 2] += eB * weight;
        };
        const forwardDx = forward ? 1 : -1;
        spread(forwardDx, 0, 7 / 16);
        spread(-forwardDx, 1, 3 / 16);
        spread(0, 1, 5 / 16);
        spread(forwardDx, 1, 1 / 16);
      }
    }
  } else {
    for (let v = 0; v < live; v += 1) {
      const index = valid[v];
      const L = labs[index * 3];
      const A = labs[index * 3 + 1];
      const B = labs[index * 3 + 2];
      let best = 0;
      let bestDistance = Infinity;
      for (let c = 0; c < chosenLabs.length; c += 1) {
        const lab = chosenLabs[c];
        const dl = L - lab[0];
        const da = A - lab[1];
        const db = B - lab[2];
        const d = dl * dl + da * da + db * db;
        if (d < bestDistance) {
          bestDistance = d;
          best = c;
        }
      }
      cells[index] = best;
      counts[best] += 1;
    }
  }

  const order = Array.from(counts.keys()).sort((a, b) => counts[b] - counts[a]);
  const remap = new Int32Array(chosen.length);
  order.forEach((from, to) => {
    remap[from] = to;
  });
  for (let i = 0; i < n; i += 1) {
    if (cells[i] >= 0) cells[i] = remap[cells[i]];
  }
  const colors = order.map((from) => ({
    code: chosen[from].code,
    hex: chosen[from].hex,
    luminance: chosen[from].luminance,
    count: counts[from],
  }));
  colors.sort(codeOrder);
  let total = 0;
  for (const color of colors) total += color.count;

  return {
    w,
    h,
    cells,
    colors,
    total,
    empty: n - total,
    bgRemoved: !!bg,
    bgCoverage: bg ? bg.coverage : 0,
  };
}

/** Sample the source image down to the grid and read its pixels. */
function sampleGrid(source, w, h, createCanvas) {
  let canvas = source;
  let sw = canvas.width;
  let sh = canvas.height;
  while (sw > w * 2 && sh > h * 2) {
    const nw = Math.max(w, Math.round(sw / 2));
    const nh = Math.max(h, Math.round(sh / 2));
    const next = createCanvas(nw, nh);
    const context = next.getContext('2d', { willReadFrequently: true });
    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = 'high';
    context.drawImage(canvas, 0, 0, nw, nh);
    canvas = next;
    sw = nw;
    sh = nh;
  }
  const out = createCanvas(w, h);
  const context = out.getContext('2d', { willReadFrequently: true });
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = 'high';
  context.clearRect(0, 0, w, h);
  context.drawImage(canvas, 0, 0, w, h);
  return context.getImageData(0, 0, w, h).data;
}

`;
function formatNumber(value, lang) {
  try {
    return new Intl.NumberFormat(lang === 'en' ? 'en-US' : 'zh-CN').format(value);
  } catch (error) {
    return String(value);
  }
}
function createCanvas(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  return canvas;
}
function loadSourceFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.decoding = 'async';
    image.onload = () => {
      try {
        const max = 1800;
        const scale = Math.min(1, max / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
        const width = Math.max(1, Math.round((image.naturalWidth || 1) * scale));
        const height = Math.max(1, Math.round((image.naturalHeight || 1) * scale));
        const canvas = createCanvas(width, height);
        const context = canvas.getContext('2d', { willReadFrequently: true });
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(image, 0, 0, width, height);
        resolve({ canvas, width, height, name: file.name || 'image', url, owned: true });
      } catch (error) {
        URL.revokeObjectURL(url);
        reject(error);
      }
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('decode'));
    };
    image.src = url;
  });
}

function makeDemoSource() {
  const size = 320;
  const canvas = createCanvas(size, size);
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, size, size);
  const heart = (scale, offsetY, fill) => {
    g.save();
    g.translate(size / 2, size / 2 + offsetY);
    g.scale(scale, scale);
    g.beginPath();
    g.moveTo(0, 84);
    g.bezierCurveTo(-76, 26, -92, -40, -43, -62);
    g.bezierCurveTo(-16, -74, -2, -52, 0, -32);
    g.bezierCurveTo(2, -52, 16, -74, 43, -62);
    g.bezierCurveTo(92, -40, 76, 26, 0, 84);
    g.closePath();
    g.fillStyle = fill;
    g.fill();
    g.restore();
  };
  heart(1, 4, '#E24A5B');
  heart(0.62, -14, '#F4939D');
  g.fillStyle = '#F4C24A';
  const sparkle = (cx, cy, r) => {
    g.beginPath();
    g.moveTo(cx, cy - r);
    g.quadraticCurveTo(cx, cy, cx + r, cy);
    g.quadraticCurveTo(cx, cy, cx, cy + r);
    g.quadraticCurveTo(cx, cy, cx - r, cy);
    g.quadraticCurveTo(cx, cy, cx, cy - r);
    g.fill();
  };
  sparkle(56, 70, 15);
  sparkle(262, 116, 10);
  sparkle(250, 48, 7);
  return {
    canvas,
    width: size,
    height: size,
    name: 'demo-heart',
    url: canvas.toDataURL('image/png'),
    owned: false,
  };
}

function fileNameFor(pat, source, extension) {
  const raw = (source && source.name ? source.name : 'pindou').replace(/\.[^.]+$/, '');
  const base = raw.replace(/[^\w\u4e00-\u9fa5-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'pindou';
  return base + '-' + pat.w + 'x' + pat.h + '-mard.' + extension;
}

function drawPattern(canvas, pattern, options) {
  const zoom = options.zoom === 0 ? 0 : options.zoom || 1;
  const stageWidth = options.stageWidth || 760;
  const stageHeight = options.stageHeight || 0;
  const showCodes = options.showCodes !== false;
  const digits = String(Math.max(pattern.w, pattern.h)).length;
  const band = clamp(12 + digits * 6, 18, 34);
  const pad = 14;
  const available = Math.max(120, stageWidth - pad * 2 - band - 2);
  const availableH = stageHeight > 0 ? Math.max(120, stageHeight - pad * 2 - band - 2) : 0;
  let cell;
  if (zoom === 0) {
    // 整图模式：宽高一起塞进舞台，太小的时候不画色号
    cell = Math.floor(available / pattern.w);
    if (availableH > 0) cell = Math.min(cell, Math.floor(availableH / pattern.h));
    cell = clamp(cell, 4, 44);
  } else {
    // 细节模式：保证色号放得下，宽图横向滚动
    const minCell = showCodes ? 20 : 4;
    cell = Math.floor(available / pattern.w);
    cell = clamp(cell, minCell, 44);
    if (zoom > 1) cell = Math.round(cell * zoom);
  }
  const dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  const maxDevice = 8192;
  const cellLimit = Math.floor(maxDevice / (Math.max(pattern.w, pattern.h) * dpr));
  if (cellLimit >= 1) cell = Math.min(cell, cellLimit);
  const logicalW = band + pattern.w * cell + pad;
  const logicalH = band + pattern.h * cell + pad;
  canvas.width = Math.round(logicalW * dpr);
  canvas.height = Math.round(logicalH * dpr);
  canvas.style.width = logicalW + 'px';
  canvas.style.height = logicalH + 'px';
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, logicalW, logicalH);
  g.fillStyle = '#FBF9F4';
  g.fillRect(0, 0, logicalW, logicalH);

  const originX = band;
  const originY = band;
  for (let y = 0; y < pattern.h; y += 1) {
    for (let x = 0; x < pattern.w; x += 1) {
      const index = pattern.cells[y * pattern.w + x];
      if (index < 0) continue;
      g.fillStyle = pattern.colors[index].hex;
      g.fillRect(originX + x * cell, originY + y * cell, cell, cell);
    }
  }

  const steps = [1, 2, 5, 10, 20, 50];
  let step = steps[0];
  for (const candidate of steps) {
    step = candidate;
    if (candidate * cell >= 15) break;
  }
  const lineDark = 'rgba(104,96,84,0.20)';
  const lineSoft = 'rgba(104,96,84,0.13)';
  for (let x = 0; x <= pattern.w; x += 1) {
    g.strokeStyle = x % 5 === 0 ? lineDark : lineSoft;
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(originX + x * cell + 0.5, originY);
    g.lineTo(originX + x * cell + 0.5, originY + pattern.h * cell);
    g.stroke();
  }
  for (let y = 0; y <= pattern.h; y += 1) {
    g.strokeStyle = y % 5 === 0 ? lineDark : lineSoft;
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(originX, originY + y * cell + 0.5);
    g.lineTo(originX + pattern.w * cell, originY + y * cell + 0.5);
    g.stroke();
  }
  g.strokeStyle = 'rgba(74,66,55,0.42)';
  g.lineWidth = 1.4;
  g.strokeRect(originX + 0.5, originY + 0.5, pattern.w * cell - 1, pattern.h * cell - 1);

  const numberFont = clamp(cell * 0.52, 8, 11);
  g.fillStyle = '#6C655A';
  g.font = '500 ' + numberFont.toFixed(1) + 'px ui-monospace, "SFMono-Regular", Consolas, monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let x = 0; x < pattern.w; x += 1) {
    if ((x + 1) % step !== 0) continue;
    g.fillText(String(x + 1), originX + x * cell + cell / 2, originY - band / 2);
  }
  for (let y = 0; y < pattern.h; y += 1) {
    if ((y + 1) % step !== 0) continue;
    g.fillText(String(y + 1), originX - band / 2, originY + y * cell + cell / 2);
  }

  if (showCodes) {
    let maxChars = 1;
    for (const color of pattern.colors) maxChars = Math.max(maxChars, color.code.length);
    let fontSize = Math.min(Math.round(cell * 0.52), 20);
    fontSize = Math.min(fontSize, Math.floor((cell - 2) / (maxChars * 0.56)));
    if (fontSize >= 4) {
      g.font = '600 ' + fontSize + 'px ui-monospace, "SFMono-Regular", Consolas, monospace';
      for (let y = 0; y < pattern.h; y += 1) {
        for (let x = 0; x < pattern.w; x += 1) {
          const index = pattern.cells[y * pattern.w + x];
          if (index < 0) continue;
          const color = pattern.colors[index];
          g.fillStyle = color.luminance > 0.58 ? 'rgba(32,28,23,0.78)' : 'rgba(255,255,255,0.9)';
          g.fillText(color.code, originX + x * cell + cell / 2, originY + y * cell + cell / 2 + 0.5);
        }
      }
    }
  }
}

function renderSheet(pattern, labels, lang) {
  const { w, h, cells, colors, total } = pattern;
  const maxDim = Math.max(w, h);
  let cell = Math.floor(3200 / maxDim);
  cell = clamp(cell, 16, 52);
  if (cell * maxDim > 4100) cell = Math.floor(4100 / maxDim);
  const numBand = Math.max(20, Math.round(cell * 0.82));
  const padX = 56;
  const padTop = 46;
  const titleH = 108;
  const gapAfterGrid = 34;
  const legendHeadH = 48;
  const chipW = 152;
  const chipH = 42;
  const footerH = 54;
  const gridW = w * cell;
  const gridH = h * cell;
  const contentW = gridW + numBand * 2;
  const sheetW = padX * 2 + contentW;
  const perRow = Math.max(1, Math.floor(contentW / chipW));
  const rows = Math.ceil(colors.length / perRow);
  const legendH = legendHeadH + rows * chipH + 8;
  const sheetH = padTop + titleH + numBand + gridH + numBand + gapAfterGrid + legendH + footerH;
  const canvas = createCanvas(sheetW, sheetH);
  const g = canvas.getContext('2d');
  const SANS = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
  const MONO = 'ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace';

  g.fillStyle = '#FBF9F4';
  g.fillRect(0, 0, sheetW, sheetH);
  g.fillStyle = '#E9D9B9';
  g.fillRect(0, 0, sheetW, 7);

  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#221F1B';
  g.font = '700 34px ' + SANS;
  g.fillText(labels.title, padX, padTop + 40);
  g.fillStyle = '#6F675C';
  g.font = '400 15px ' + SANS;
  g.fillText(labels.subtitle, padX, padTop + 70);
  g.textAlign = 'right';
  g.fillStyle = '#B6A78E';
  g.font = '700 20px ' + MONO;
  g.fillText('MARD', sheetW - padX, padTop + 38);

  const originX = padX + numBand;
  const originY = padTop + titleH + numBand;
  for (let y = 0; y < h; y += 1) {
    for (let x = 0; x < w; x += 1) {
      const index = cells[y * w + x];
      if (index < 0) continue;
      g.fillStyle = colors[index].hex;
      g.fillRect(originX + x * cell, originY + y * cell, cell, cell);
    }
  }

  g.strokeStyle = '#DCD5C9';
  g.lineWidth = 1;
  for (let x = 0; x <= w; x += 1) {
    g.beginPath();
    g.moveTo(originX + x * cell + 0.5, originY);
    g.lineTo(originX + x * cell + 0.5, originY + gridH);
    g.stroke();
  }
  for (let y = 0; y <= h; y += 1) {
    g.beginPath();
    g.moveTo(originX, originY + y * cell + 0.5);
    g.lineTo(originX + gridW, originY + y * cell + 0.5);
    g.stroke();
  }
  g.strokeStyle = '#B5AA97';
  g.lineWidth = 1.5;
  g.strokeRect(originX + 0.5, originY + 0.5, gridW - 1, gridH - 1);

  const numberFont = Math.max(9, Math.round(cell * 0.36));
  g.fillStyle = '#6E665A';
  g.font = '600 ' + numberFont + 'px ' + MONO;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let x = 0; x < w; x += 1) {
    const cx = originX + x * cell + cell / 2;
    g.fillText(String(x + 1), cx, originY - numBand / 2);
    g.fillText(String(x + 1), cx, originY + gridH + numBand / 2);
  }
  for (let y = 0; y < h; y += 1) {
    const cy = originY + y * cell + cell / 2;
    g.fillText(String(y + 1), originX - numBand / 2, cy);
    g.fillText(String(y + 1), originX + gridW + numBand / 2, cy);
  }

  let maxChars = 1;
  for (const color of colors) maxChars = Math.max(maxChars, color.code.length);
  let codeFont = Math.min(Math.round(cell * 0.46), 20);
  codeFont = Math.min(codeFont, Math.floor((cell - 3) / (maxChars * 0.56)));
  if (codeFont >= 5) {
    g.font = '600 ' + codeFont + 'px ' + MONO;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (let y = 0; y < h; y += 1) {
      for (let x = 0; x < w; x += 1) {
        const index = cells[y * w + x];
        if (index < 0) continue;
        const color = colors[index];
        g.fillStyle = color.luminance > 0.58 ? 'rgba(30,26,21,0.8)' : 'rgba(255,255,255,0.92)';
        g.fillText(color.code, originX + x * cell + cell / 2, originY + y * cell + cell / 2 + 0.5);
      }
    }
  }

  const legendTop = originY + gridH + numBand + gapAfterGrid;
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#3B352D';
  g.font = '700 21px ' + SANS;
  g.fillText(labels.legend, padX, legendTop + 26);
  g.textAlign = 'right';
  g.fillStyle = '#8A8174';
  g.font = '400 15px ' + SANS;
  g.fillText(labels.total, sheetW - padX, legendTop + 26);

  const chipsTop = legendTop + legendHeadH;
  colors.forEach((color, index) => {
    const col = index % perRow;
    const row = Math.floor(index / perRow);
    const x = padX + col * chipW;
    const y = chipsTop + row * chipH;
    g.fillStyle = color.hex;
    g.fillRect(x, y + 6, 26, 26);
    g.strokeStyle = 'rgba(0,0,0,0.16)';
    g.lineWidth = 1;
    g.strokeRect(x + 0.5, y + 6.5, 25, 25);
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillStyle = '#2F2A24';
    g.font = '600 17px ' + MONO;
    g.fillText(color.code, x + 36, y + 19);
    const codeW = g.measureText(color.code).width;
    g.fillStyle = '#7A7266';
    g.font = '400 14.5px ' + SANS;
    g.fillText(formatNumber(color.count, lang), x + 36 + codeW + 9, y + 19);
  });

  g.strokeStyle = '#E2DACD';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(padX, sheetH - footerH + 6);
  g.lineTo(sheetW - padX, sheetH - footerH + 6);
  g.stroke();
  g.textAlign = 'left';
  g.fillStyle = '#8A8174';
  g.font = '400 13px ' + SANS;
  g.fillText(labels.footer, padX, sheetH - footerH + 30);
  g.textAlign = 'right';
  g.fillStyle = '#A39A8B';

function webLoadSettings() {
  const merged = Object.assign({}, WEB_DEFAULTS);
  try {
    const raw = localStorage.getItem(WEB_STORE_KEY);
    if (raw) {
      const saved = JSON.parse(raw).settings || {};
      for (const key of Object.keys(WEB_DEFAULTS)) {
        if (saved[key] !== undefined && saved[key] !== null) merged[key] = saved[key];
      }
    }
  } catch (error) { /* ignore */ }
  merged.w = clamp(Math.round(Number(merged.w) || 50), 8, 200);
  merged.h = clamp(Math.round(Number(merged.h) || 50), 8, 200);
  merged.maxColors = clamp(Math.round(Number(merged.maxColors) || 24), 2, 96);
  merged.tolerance = clamp(Math.round(Number(merged.tolerance) || 12), 0, 60);
  merged.scope = merged.scope === 'all' ? 'all' : 'standard';
  merged.showCodes = merged.showCodes !== false;
  merged.dither = !!merged.dither;
  merged.removeBg = !!merged.removeBg;
  return merged;
}

  try {

      '<div class="bar"><h3 data-i18n="export.previewTitle">图纸预览</h3><button class="btn ghost small" id="modalClose" type="button" data-i18n="action.close">关闭</button></div>' +
      '<div class="shot"><img id="sheetImg" alt=""></div>' +
      '<div class="foot"><button class="btn ghost" id="modalClose2" type="button" data-i18n="action.close">关闭</button><button class="btn primary" id="downloadBtn" type="button" data-i18n="action.download">下载 PNG</button></div>' +
    '</div></div>' +
    '<div class="toast" id="toast"></div>';
}

function webWire() {
  webViews.drop = webEl('drop');
  webViews.fileInput = webEl('fileInput');
  webViews.thumb = webEl('thumb');
  webViews.thumbImg = webEl('thumbImg');
  webViews.thumbName = webEl('thumbName');
  webViews.thumbSize = webEl('thumbSize');
  webViews.dropPh = webEl('dropPh');
  webViews.removeBtn = webEl('removeBtn');
  webViews.presets = webEl('presets');
  webViews.wInput = webEl('wInput');
  webViews.hInput = webEl('hInput');
  webViews.fitBtn = webEl('fitBtn');
  webViews.scopeSeg = webEl('scopeSeg');
  webViews.maxInput = webEl('maxInput');
  webViews.maxOut = webEl('maxOut');
  webViews.ditherInput = webEl('ditherInput');
  webViews.bgInput = webEl('bgInput');
  webViews.tolWrap = webEl('tolWrap');
  webViews.tolInput = webEl('tolInput');
  webViews.tolOut = webEl('tolOut');
  webViews.tolLabel = webEl('tolLabel');
  webViews.codesInput = webEl('codesInput');
  webViews.canvas = webEl('canvas');
  webViews.scroll = webEl('scroll');
  webViews.empty = webEl('empty');
  webViews.legend = webEl('legend');
  webViews.legendList = webEl('legendList');
  webViews.legendTotal = webEl('legendTotal');
  webViews.statSize = webEl('statSize');
  webViews.statColors = webEl('statColors');
  webViews.statBeads = webEl('statBeads');
  webViews.stage = webEl('stage');
  webViews.spinner = webEl('spinner');
  webViews.exportBtn = webEl('exportBtn');
  webViews.csvBtn = webEl('csvBtn');
  webViews.langBtn = webEl('langBtn');
  webViews.resetBtn = webEl('resetBtn');
  webViews.zoomLabel = webEl('zoomLabel');
  webViews.modal = webEl('modal');
  webViews.sheetImg = webEl('sheetImg');
  webViews.toast = webEl('toast');

  for (const size of WEB_PRESETS) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'preset';
    button.textContent = size + '×' + size;
    button.dataset.size = String(size);
    button.addEventListener('click', () => webApplySize(size, size));
    webViews.presets.appendChild(button);
  }

  webViews.drop.addEventListener('click', () => webViews.fileInput.click());
  webViews.fileInput.addEventListener('change', () => {
    const file = webViews.fileInput.files && webViews.fileInput.files[0];
    if (file) webLoadFile(file);
    webViews.fileInput.value = '';
  });
  webViews.drop.addEventListener('dragover', (event) => {
    event.preventDefault();
    webViews.drop.classList.add('over');
  });
  webViews.drop.addEventListener('dragleave', () => webViews.drop.classList.remove('over'));
  webViews.drop.addEventListener('drop', (event) => {
    event.preventDefault();
    webViews.drop.classList.remove('over');
    const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
    if (file) webLoadFile(file);
  });
  document.addEventListener('paste', (event) => {
    const data = event.clipboardData;
    if (!data) return;
    const file = data.files && data.files[0];
    if (!file || !/^image\//.test(file.type || '')) return;
    event.preventDefault();
    webLoadFile(file);
  });

  webEl('demoBtn').addEventListener('click', webLoadDemo);
  webEl('emptyDemo').addEventListener('click', webLoadDemo);
  const cta = webEl('emptyCta');
  if (cta) cta.addEventListener('click', () => webViews.fileInput.click());
  webViews.removeBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    webRemoveSource();
  });

  webViews.wInput.addEventListener('change', () => webSizeFromInput());
  webViews.hInput.addEventListener('change', () => webSizeFromInput());
  webViews.fitBtn.addEventListener('click', () => webFitToImage(true));

  webViews.scopeSeg.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-scope]');
    if (!button) return;
    webPatch({ scope: button.dataset.scope });
  });
  webViews.maxInput.addEventListener('input', () => {
    const value = clamp(Number(webViews.maxInput.value) || 24, 2, 64);
    webViews.maxOut.textContent = String(value);
    webPatch({ maxColors: value }, true, 160);
  });
  webViews.ditherInput.addEventListener('change', () => webPatch({ dither: webViews.ditherInput.checked }));
  webViews.bgInput.addEventListener('change', () => {
    const on = webViews.bgInput.checked;
    webViews.tolWrap.hidden = !on;
    webPatch({ removeBg: on });
  });
  webViews.tolInput.addEventListener('input', () => {
    const value = clamp(Number(webViews.tolInput.value) || 12, 0, 60);
    webViews.tolOut.textContent = String(value);
    webViews.tolLabel.textContent = webT('bg.tolerance', { n: value });
    webPatch({ tolerance: value }, true, 200);
  });
  webViews.codesInput.addEventListener('change', () => {
    webState.settings.showCodes = webViews.codesInput.checked;
    webSaveSettings();
    webDraw();
  });

  webEl('zoomIn').addEventListener('click', () => webSetZoom(webState.zoom === 0 ? 1 : webState.zoom + 1));
  webEl('zoomOut').addEventListener('click', () => webSetZoom(webState.zoom - 1));
  webEl('zoomFit').addEventListener('click', () => webSetZoom(0));
  webViews.langBtn.addEventListener('click', () => {
    webState.lang = webState.lang === 'zh' ? 'en' : 'zh';
    document.documentElement.lang = webState.lang === 'en' ? 'en' : 'zh-CN';
    webSyncLanguageChrome();
    webRender();
  });
  webViews.resetBtn.addEventListener('click', webReset);

  webViews.exportBtn.addEventListener('click', webExportSheet);
  webViews.csvBtn.addEventListener('click', webExportCsv);
  webEl('modalClose').addEventListener('click', webCloseModal);
  webEl('modalClose2').addEventListener('click', webCloseModal);
  webViews.modal.addEventListener('click', (event) => {
    if (event.target === webViews.modal) webCloseModal();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && webViews.modal.classList.contains('on')) webCloseModal();
  });
  webEl('downloadBtn').addEventListener('click', () => {
    if (!webState.sheet) return;
    const link = document.createElement('a');
    link.href = webState.sheet.url;
    link.download = webState.sheet.name;
    link.click();
    webToast(webT('toast.exported', { name: webState.sheet.name }));
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (webState.pattern) webDraw(); }, 160);
  });

  // expose for debugging / automation
  window.__pindouWeb = {
    loadFile: webLoadFile,
    loadDemo: webLoadDemo,
    state: () => webState,
    exportSheet: webExportSheet,
  };
}

function webSyncLanguageChrome() {
  document.title = webT('app.title') + ' · ' + (webState.lang === 'en' ? '拼豆图纸工坊' : 'Bead Pattern Studio');
  webViews.langBtn.textContent = webState.lang === 'en' ? '中文' : 'EN';
  webEl('zoomOut').setAttribute('aria-label', webT('action.zoomOut'));
  webEl('zoomIn').setAttribute('aria-label', webT('action.zoomIn'));
  webEl('zoomFit').textContent = webState.lang === 'en' ? 'Fit' : '适应';
  webEl('zoomLabel').textContent = webState.zoom === 0 ? webT('zoom.full') : webState.zoom + '×';
  const dict = webState.lang === 'en' ? en : zh;
  document.querySelectorAll('[data-i18n]').forEach((node) => {
    const key = node.getAttribute('data-i18n');
    if (key === 'color.standardShort') {
      node.textContent = webState.lang === 'en' ? 'Standard ' + MARD_STANDARD_COUNT : '标准 ' + MARD_STANDARD_COUNT;
      return;
    }
    if (key === 'color.allShort') {
      node.textContent = webState.lang === 'en' ? 'All ' + MARD_TOTAL_COUNT : '全部 ' + MARD_TOTAL_COUNT;
      return;
    }
    if (dict[key] !== undefined) node.textContent = dict[key];
  });
}

function webPatch(next, soft, delay) {
  Object.assign(webState.settings, next);
  webSaveSettings();
  webRenderControls();
  if (soft) {
    webSchedule(delay || 120);
  } else {
    webSchedule(140);
  }
}

function webSchedule(delay) {
  clearTimeout(webState.timer);
  webState.timer = setTimeout(() => { webRebuild(); }, delay || 120);
}

function webApplySize(w, h) {
  webState.settings.w = clamp(Math.round(w), 8, 200);
  webState.settings.h = clamp(Math.round(h), 8, 200);
  webSaveSettings();
  webRenderControls();
  webSchedule(90);
}

function webSizeFromInput() {
  webState.settings.w = clamp(Math.round(Number(webViews.wInput.value) || 50), 8, 200);
  webState.settings.h = clamp(Math.round(Number(webViews.hInput.value) || 50), 8, 200);
  webSaveSettings();
  webRenderControls();
  webSchedule(90);
}

function webFitToImage(announce) {
  const source = webState.source;
  if (!source) return;
  const span = Math.max(webState.settings.w, webState.settings.h);
  const ratio = source.height / source.width;
  const h = clamp(Math.round(span * ratio), 8, 200);
  webState.settings.h = h;
  webSaveSettings();
  webRenderControls();
  if (announce) webToast(webT('size.adjusted', { w: webState.settings.w, h }));
  webSchedule(90);
}

function webSetZoom(value) {
  const next = clamp(Math.round(value), 0, 3);
  if (next === webState.zoom) return;
  webState.zoom = next;
  webViews.zoomLabel.textContent = next === 0 ? webT('zoom.full') : next + '×';
  if (webState.pattern) webDraw();
}

function webReset() {
  webState.settings = Object.assign({}, WEB_DEFAULTS);
  webSaveSettings();
  webRenderControls();
  webToast(webT('toast.reset'));
  webSchedule(80);
}

function webRender() {
  webRenderControls();
  webRenderSource();
  webRenderStats();
  webRenderLegend();
  webDraw();
}

function webRenderControls() {
  const s = webState.settings;
  webViews.wInput.value = String(s.w);
  webViews.hInput.value = String(s.h);
  webViews.maxInput.value = String(s.maxColors);
  webViews.maxOut.textContent = String(s.maxColors);
  webViews.ditherInput.checked = !!s.dither;
  webViews.bgInput.checked = !!s.removeBg;
  webViews.tolWrap.hidden = !s.removeBg;
  webViews.tolInput.value = String(s.tolerance);
  webViews.tolOut.textContent = String(s.tolerance);
  webViews.tolLabel.textContent = webT('bg.tolerance', { n: s.tolerance });
  webViews.codesInput.checked = s.showCodes !== false;
  webViews.zoomLabel.textContent = webState.zoom + '×';
  for (const button of webViews.presets.querySelectorAll('button')) {
    const size = Number(button.dataset.size);
    button.classList.toggle('on', s.w === size && s.h === size);
  }
  for (const button of webViews.scopeSeg.querySelectorAll('button')) {
    button.classList.toggle('on', button.dataset.scope === s.scope);
  }
}

function webRenderSource() {
  const source = webState.source;
  webViews.dropPh.hidden = !!source;
  webViews.thumb.hidden = !source;
  webViews.removeBtn.hidden = !source;
  if (source) {
    webViews.thumbImg.src = source.url;
    webViews.thumbName.textContent = source.name;
    webViews.thumbSize.textContent = source.width + ' × ' + source.height + ' px';
  } else {
    webViews.thumbImg.removeAttribute('src');
  }
}

function webRenderStats() {
  const pattern = webState.pattern;
  const s = webState.settings;
  webViews.stage.classList.toggle('busy', webState.busy);
  if (!pattern) {
    webViews.statSize.textContent = s.w + ' × ' + s.h;
    webViews.statColors.textContent = '';
    webViews.statBeads.textContent = webState.busy ? webT('stats.busy') : '';
    return;
  }
  webViews.statSize.textContent = pattern.w + ' × ' + pattern.h;
  webViews.statColors.textContent = pattern.colors.length + ' ' + (webState.lang === 'en' ? 'colors' : '色');
  webViews.statBeads.textContent = formatNumber(pattern.total, webState.lang) + ' ' + (webState.lang === 'en' ? 'beads' : '颗');
}

function webRenderLegend() {
  const pattern = webState.pattern;
  if (!pattern || !pattern.colors.length) {
    webViews.legend.hidden = true;
    return;
  }
  webViews.legend.hidden = false;
  webViews.legendTotal.textContent = webT('legend.total', { n: formatNumber(pattern.total, webState.lang) });
  const parts = [];
  for (const color of pattern.colors) {
    parts.push('<span class="chip"><i style="background:' + color.hex + '"></i><b>' + color.code +
      '</b><span>' + formatNumber(color.count, webState.lang) + '</span></span>');
  }
  webViews.legendList.innerHTML = parts.join('');
}

function webDraw() {
  const pattern = webState.pattern;
  const canvas = webViews.canvas;
  if (!pattern) {
    canvas.hidden = true;
    webViews.empty.hidden = false;
    return;
  }
  canvas.hidden = false;
  webViews.empty.hidden = true;
  const stageWidth = Math.max(320, webViews.scroll.clientWidth - 32);
  const stageHeight = Math.max(280, webViews.scroll.clientHeight - 32);
  drawPattern(canvas, pattern, {
    stageWidth,
    stageHeight,
    zoom: webState.zoom,
    showCodes: webState.settings.showCodes !== false,
  });
  const scroller = webViews.scroll;
  if (scroller.scrollWidth > scroller.clientWidth + 1) {
    scroller.scrollLeft = Math.round((scroller.scrollWidth - scroller.clientWidth) / 2);
  }
}

function webLoadFile(file) {
  if (!file || !/^image\//.test(file.type || '')) {
    webToast(webT('error.type'));
    return;
  }
  loadSourceFile(file).then((source) => {
    webAdoptSource(source);
  }).catch((error) => {
    console.warn('[pindou] load failed', error);
    webToast(webT('error.load'));
  });
}

function webLoadDemo() {
  webAdoptSource(makeDemoSource());
}

function webAdoptSource(source) {
  if (webState.source && webState.source.owned && webState.source.url) {
    URL.revokeObjectURL(webState.source.url);
  }
  webState.source = source;
  webState.error = null;
  webState.zoom = 1;
  const ratio = source.height / source.width;
  if (webState.settings.w === webState.settings.h && Math.abs(ratio - 1) > 0.12) {
    webState.settings.h = clamp(Math.round(webState.settings.w * ratio), 8, 200);
    webSaveSettings();
    webToast(webT('size.adjusted', { w: webState.settings.w, h: webState.settings.h }));
  }
  webRenderSource();
  webRenderControls();
  webSchedule(30);
}

function webRemoveSource() {
  if (webState.source && webState.source.owned && webState.source.url) {
    URL.revokeObjectURL(webState.source.url);
  }
  webState.source = null;
  webState.pattern = null;
  webState.error = null;
  webRenderSource();
  webRenderStats();
  webRenderLegend();
  webDraw();
}

function webRebuild() {
  if (!webState.source) return;
  const settings = webState.settings;
  webState.busy = true;
  webRenderStats();
  const run = () => {
    try {
      const rgba = sampleGrid(webState.source.canvas, settings.w, settings.h, createCanvas);
      const pattern = buildPattern(rgba, settings.w, settings.h, {
        maxColors: settings.maxColors,
        scope: settings.scope,
        dither: settings.dither,
        removeBg: settings.removeBg,
        tolerance: settings.tolerance,
      });
      webState.pattern = pattern;
      webState.error = null;
      if (pattern.bgRemoved === false && settings.removeBg) {
        webToast(webT('bg.notDetected'));
      }
    } catch (error) {
      webState.pattern = null;
      webState.error = error && error.code === 'empty' ? 'empty' : 'build';
      console.warn('[pindou] build failed', error);
    }
    webState.busy = false;
    webRenderStats();
    webRenderLegend();
    webDraw();
    webViews.exportBtn.disabled = !webState.pattern;
    webViews.csvBtn.disabled = !webState.pattern;
    if (webState.error) webToast(webT(webState.error === 'empty' ? 'error.empty' : 'error.build'));
  };
  requestAnimationFrame(run);
}

function webExportSheet() {
  const pattern = webState.pattern;
  if (!pattern) return;
  const lang = webState.lang;
  const labels = {
    title: webT('export.title'),
    subtitle: webT('export.subtitle', {
      w: pattern.w,
      h: pattern.h,
      colors: pattern.colors.length,
      beads: formatNumber(pattern.total, lang),
    }),
    legend: webT('export.legendTitle', { n: pattern.colors.length }),
    total: webT('legend.total', { n: formatNumber(pattern.total, lang) }),
    footer: webT('export.footer'),
  };
  try {
    const sheet = renderSheet(pattern, labels, lang);
    const url = sheet.toDataURL('image/png');
    webState.sheet = { url, name: fileNameFor({ w: pattern.w, h: pattern.h }, webState.source, 'png') };
    webViews.sheetImg.src = url;
    webViews.modal.classList.add('on');
  } catch (error) {
    console.warn('[pindou] export failed', error);
    webToast(webT('toast.failed'));
  }
}

function webCloseModal() {
  webViews.modal.classList.remove('on');
}

function webExportCsv() {
  const pattern = webState.pattern;
  if (!pattern) return;
  const lines = ['\ufeffcode,hex,count'];
  for (const color of pattern.colors) {
    lines.push(color.code + ',' + color.hex + ',' + color.count);
  }
  lines.push('TOTAL,,' + pattern.total);
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = fileNameFor({ w: pattern.w, h: pattern.h }, webState.source, 'csv');
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  webToast(webT('toast.csv'));
}

let webToastTimer = 0;
function webToast(message) {
  if (!message) return;
  webViews.toast.textContent = message;
  webViews.toast.classList.add('on');
  clearTimeout(webToastTimer);
  webToastTimer = setTimeout(() => webViews.toast.classList.remove('on'), 2400);
}

function webBoot() {
  const style = document.createElement('style');
  style.textContent = WEB_CSS;
  document.head.appendChild(style);
  const icon = document.createElement('link');
  icon.rel = 'icon';
  icon.href = WEB_URL_SVG;
  document.head.appendChild(icon);
  webBuild();
  document.documentElement.lang = webState.lang === 'en' ? 'en' : 'zh-CN';
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', webBoot);
} else {
  webBoot();
}
})();
</script>
</body>
</html>
